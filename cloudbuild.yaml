steps:
  - id: "Docker build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "."

  - id: "Container image push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

  - id: "Cloud Run deploy"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--service-account"
      - "${_SERVICE_ACCOUNT}"
      - "--max-instances"
      - "5"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

substitutions:
  _REPO_REGION: "asia-south1-docker.pkg.dev"
  _REPO_NAME: "aura"
  _SERVICE_NAME: "noney-api-prod"
  _REGION: "asia-south1"
  _PROJ_ID: "aura-hypen-497709"
  _SERVICE_ACCOUNT: "aura-service-account@aura-hypen-497709.iam.gserviceaccount.com"
  _SECRET_ID: "noney-api-env"
