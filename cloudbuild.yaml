steps:
  - id: "Docker build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "."

  - id: "Container image push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

  - id: "Create Cloud Run service YAML"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cat > service.yaml <<EOF
        apiVersion: serving.knative.dev/v1
        kind: Service
        metadata:
          name: ${_SERVICE_NAME}
          annotations:
            run.googleapis.com/launch-stage: BETA
        spec:
          template:
            spec:
              serviceAccountName: ${_SERVICE_ACCOUNT}
              containers:
                - image: ${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest
                  ports:
                    - containerPort: 8080
                  volumeMounts:
                    - name: env-volume
                      mountPath: /app/.env
                      subPath: .env
              volumes:
                - name: env-volume
                  secret:
                    secretName: ${_SECRET_ID}
                    items:
                      - key: latest
                        path: .env
        EOF

  - id: "Cloud Run deploy"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "services"
      - "replace"
      - "service.yaml"
      - "--region"
      - "${_REGION}"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

substitutions:
  _REPO_REGION: "asia-south1-docker.pkg.dev"
  _REPO_NAME: "aura"
  _SERVICE_NAME: "noney-api-prod"
  _REGION: "asia-south1"
  _PROJ_ID: "aura-hypen-497709"
  _SERVICE_ACCOUNT: "aura-service-account@aura-hypen-497709.iam.gserviceaccount.com"
  _SECRET_ID: "noney-api-env"