steps:
  - id: "Docker build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "."

  - id: "Container image push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

  - id: "Cloud Run deploy"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--service-account"
      - "${_SERVICE_ACCOUNT}"
      - "--max-instances"
      - "5"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--set-secrets"
      - >-
        CDN_URL=CDN_URL:latest,
        CRYPTO_NONCE_SIZE=CRYPTO_NONCE_SIZE:latest,
        CRYPTO_SALT=CRYPTO_SALT:latest,
        CRYPTO_SECRET_KEY=CRYPTO_SECRET_KEY:latest,
        CRYPTO_SEPARATOR=CRYPTO_SEPARATOR:latest,
        DEBUG=DEBUG:latest,
        ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest,
        ELEVENLABS_VOICE_ID=ELEVENLABS_VOICE_ID:latest,
        FIREBASE_CREDENTIALS=FIREBASE_CREDENTIALS:latest,
        GITHUB1_BRANCH_NAME=GITHUB1_BRANCH_NAME:latest,
        GITHUB1_REPO_NAME=GITHUB1_REPO_NAME:latest,
        GITHUB1_TOKEN=GITHUB1_TOKEN:latest,
        GITHUB1_USERNAME=GITHUB1_USERNAME:latest,
        GOOGLE_API_KEY=GOOGLE_API_KEY:latest,
        HOST=HOST:latest,
        VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,
        VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,
        VAPID_CLAIMS_EMAIL=VAPID_CLAIMS_EMAIL:latest,
        GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,
        GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,
        GOOGLE_MAIL_OAUTH_REDIRECT_URI=GOOGLE_MAIL_OAUTH_REDIRECT_URI:latest,
        GOOGLE_SHEETS_OAUTH_REDIRECT_URI=GOOGLE_SHEETS_OAUTH_REDIRECT_URI:latest,
        WEBEX_OAUTH_CLIENT_ID=WEBEX_OAUTH_CLIENT_ID:latest,
        WEBEX_OAUTH_CLIENT_SECRET=WEBEX_OAUTH_CLIENT_SECRET:latest,
        WEBEX_OAUTH_REDIRECT_URI=WEBEX_OAUTH_REDIRECT_URI:latest,
        WEBEX_OAUTH_SCOPES=WEBEX_OAUTH_SCOPES:latest,
        FRONTEND_URL=FRONTEND_URL:latest

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REPO_REGION}/${_PROJ_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

substitutions:
  _REPO_REGION: "asia-south1-docker.pkg.dev"
  _REPO_NAME: "aura"
  _SERVICE_NAME: "noney-api-prod"
  _REGION: "asia-south1"
  _PROJ_ID: "aura-hypen-497709"
  _SERVICE_ACCOUNT: "aura-service-account@aura-hypen-497709.iam.gserviceaccount.com"
